name: Health check

# End-to-end read-only check against the live Custom Search JSON API. Auth is a
# static API key + engine id stored as repo secrets. smoke makes NO writes (the
# API has no write endpoint): it runs exactly one 1-result search, burning one
# unit of the daily quota. Runs daily + manual dispatch only (never on push/PR),
# so secrets aren't exposed to PRs/forks; the smoke step skips itself when the
# secrets are not configured.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'A1-x-Tech/mcp-google-custom-search'
    env:
      GOOGLE_CUSTOM_SEARCH_API_KEY: ${{ secrets.GOOGLE_CUSTOM_SEARCH_API_KEY }}
      GOOGLE_CUSTOM_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_CUSTOM_SEARCH_ENGINE_ID }}
      GOOGLE_CUSTOM_SEARCH_SMOKE_QUERY: ${{ secrets.GOOGLE_CUSTOM_SEARCH_SMOKE_QUERY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        if: env.GOOGLE_CUSTOM_SEARCH_API_KEY != ''
        run: npm run smoke
      - name: Skipped (no secrets configured)
        if: env.GOOGLE_CUSTOM_SEARCH_API_KEY == ''
        run: echo "GOOGLE_CUSTOM_SEARCH_* secrets are not set — live smoke skipped."
